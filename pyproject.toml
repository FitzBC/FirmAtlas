[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firmatlas"
version = "0.1.0"
description = "Evidence-first firmware analysis platform domain core"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
firmatlas = "firmatlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
